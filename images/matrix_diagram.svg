<text x="40" y="344" font-size="22" font-weight="700" fill="#1f2937">2 &#183; The board is a 5 &#215; 12 grid (49 keys)</text>
<text x="40" y="372" font-size="15" fill="#4b5563">Solder the 5 row wires and 12 column wires to these Pro Micro pins. Rows run left&#8594;controller; columns run top&#8594;controller.</text>
