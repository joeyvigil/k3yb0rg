<text x="40" y="44" font-size="22" font-weight="700" fill="#1f2937">1 &#183; How every key is wired</text>
<text x="40" y="72" font-size="15" fill="#4b5563">Each switch has two legs: one leg joins its COLUMN, the other goes through a DIODE to its ROW.</text>
